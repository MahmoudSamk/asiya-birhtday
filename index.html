<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff9e6" media="(max-width: 760px)">
  <meta name="theme-color" content="#e7ddff">
  <meta name="description" content="كتكوت صغير مخبّي مفاجأة.">
  <title>الكتكوت 🐣</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #2a1841;
      --purple: #6b3dc1;
      --lavender: #e7ddff;
      --cream: #fff9e6;
      --yellow: #ffdb67;
      --pink: #ffc3da;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--ink);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      align-items: center;
      background:
        radial-gradient(circle at 1px 1px, #8452c02a 1px, transparent 1.3px) 0 0 / 21px 21px,
        radial-gradient(ellipse at 74% 27%, #f8eeff, transparent 55%),
        var(--lavender);
    }

    button { font: inherit; color: inherit; touch-action: manipulation; }
    button:focus-visible { outline: 3px dashed var(--purple); outline-offset: 5px; }

    .layout {
      width: min(660px, 100%);
      margin-inline: auto;
      padding: 24px;
    }

    .hint {
      position: absolute;
      inset: auto 22px 20px;
      margin: 0;
      color: #504064;
      text-align: center;
      font-size: 1rem;
    }

    .card {
      position: relative;
      isolation: isolate;
      height: clamp(360px, 43vw, 477px);
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 34px;
      box-shadow: -8px 9px 0 var(--ink);
      background:
        radial-gradient(circle, #b87f3530 1px, transparent 1.5px) 8px 8px / 16px 16px,
        var(--cream);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 11px;
      border: 1px dashed #ae83536c;
      border-radius: 24px;
      pointer-events: none;
    }

    .doodle {
      position: absolute;
      pointer-events: none;
      font: 36px/1 Georgia, serif;
    }

    .doodle-top { top: 21%; left: 11%; color: #9164d5; transform: rotate(-12deg); }
    .doodle-side { top: 49%; right: 7%; color: #b34f7d; transform: rotate(12deg); }
    .doodle-bottom { bottom: 14%; left: 14%; color: #9664db; font-size: 26px; }

    .speech {
      position: absolute;
      z-index: 2;
      top: 21px;
      left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      margin: 0;
      padding: 8px 17px 10px;
      max-width: calc(100% - 36px);
      width: max-content;
      border: 2px solid var(--ink);
      border-radius: 14px 14px 14px 4px;
      background: #fff;
      box-shadow: -3px 3px 0 var(--ink);
      font-size: 1.05rem;
      font-weight: 700;
    }

    .speech::after {
      content: "";
      position: absolute;
      left: 13px;
      bottom: -9px;
      width: 12px;
      height: 12px;
      border-right: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      background: #fff;
      transform: rotate(45deg);
    }

    .chick-button {
      position: absolute;
      z-index: 1;
      left: var(--x, 50%);
      top: var(--y, 52%);
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      width: clamp(130px, 24vw, 180px);
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      border-radius: 25px;
      background: none;
      cursor: pointer;
      transition: left 260ms cubic-bezier(.2,.8,.3,1), top 260ms cubic-bezier(.2,.8,.3,1);
      -webkit-tap-highlight-color: transparent;
    }

    .chick-button:active .chick { scale: .94; }

    .chick {
      display: block;
      position: relative;
      container-type: inline-size;
      width: 96%;
      aspect-ratio: 1.1;
      transform: rotate(var(--tilt, -7deg));
      transition: transform 260ms ease, scale 150ms ease;
    }

    .chick span { position: absolute; display: block; }
    .shadow { inset: auto 4% 1% 4%; height: 12%; border-radius: 50%; background: #b88b6b38; }
    .feet { bottom: 4%; width: 17%; height: 15%; border: 2px solid var(--ink); border-radius: 50%; background: #ff9860; }
    .feet-left { left: 25%; transform: rotate(-18deg); }
    .feet-right { right: 25%; transform: rotate(18deg); }
    .tuft {
      top: 2%;
      left: 44%;
      width: 22%;
      height: 25%;
      background: #ffe881;
      border: 2px solid var(--ink);
      border-radius: 85% 28% 65% 28%;
      transform: rotate(-25deg);
    }

    .body {
      inset: 13% 6% 11%;
      border: 2.5px solid var(--ink);
      border-radius: 48% 48% 43% 44% / 58% 58% 42% 42%;
      background: radial-gradient(ellipse at 38% 29%, #fff3a2 0%, #ffe376 45%, #ffca52 80%);
      box-shadow: inset 0 -7px 0 #f6a84452, 0 4px 0 #fff;
    }

    .wing { top: 57%; width: 20%; height: 23%; border: 2px solid var(--ink); background: #ffcf59; }
    .wing-left { left: 1%; border-radius: 70% 26% 54% 38%; transform: rotate(-28deg); }
    .wing-right { right: 1%; border-radius: 26% 70% 38% 54%; transform: rotate(28deg); }
    .eye { top: 41%; width: 8.5%; height: 12%; border-radius: 50%; background: var(--ink); }
    .eye::before { content: ""; position: absolute; width: 37%; aspect-ratio: 1; top: 17%; left: 14%; border-radius: 50%; background: white; }
    .eye-left { left: 31%; }
    .eye-right { right: 31%; }
    .blush { top: 56%; width: 12%; height: 7%; border-radius: 50%; background: #ff9bbb; }
    .blush-left { left: 19%; }
    .blush-right { right: 19%; }
    .beak { top: 53%; left: 42%; width: 16%; height: 13%; border-radius: 45% 45% 65% 65%; border: 2px solid var(--ink); background: #ff9760; }

    .card[data-count="1"] .eye-right,
    .card[data-count="3"] .eye-left { height: 6%; top: 44%; background: transparent; border-top: 2px solid var(--ink); }
    .card[data-count="1"] .eye-right::before,
    .card[data-count="3"] .eye-left::before { display: none; }
    .card[data-count="2"] .beak { width: 12%; left: 44%; height: 16%; border-radius: 50%; }
    .card[data-count="3"] .wing-right { transform: rotate(-26deg) translate(7%, -19%); }

    .celebration {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 11px;
      padding: 16px;
      text-align: center;
      animation: appear 360ms ease both;
    }

    .card[data-count="4"] { background-color: #fff0f6; }
    .party-chick { --tilt: 8deg; width: 108px; margin-top: 13px; }
    .chick .hat {
      top: -22%;
      left: 35%;
      width: 31%;
      height: 40%;
      background: repeating-linear-gradient(10deg, #8657d8 0 8px, #ffc3da 8px 16px);
      clip-path: polygon(51% 0, 100% 100%, 0 100%);
      transform: rotate(-14deg);
    }
    .chick .hat-dot {
      top: -23%;
      left: 43%;
      width: 10%;
      aspect-ratio: 1;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--yellow);
    }

    .celebration h2 {
      margin: 0;
      font: 800 clamp(1.65rem, 4.2vw, 3.05rem)/1.04 Georgia, serif;
      letter-spacing: -.045em;
    }
    .celebration h2:focus { outline: none; }
    .celebration h2 span { display: block; color: var(--purple); font-size: 1.45em; }
    .celebration p { margin: 0; font-size: 1rem; }

    .replay {
      margin-top: 3px;
      min-height: 44px;
      padding: 5px 16px;
      border: 1.5px solid var(--ink);
      border-radius: 20px;
      background: var(--yellow);
      box-shadow: -2px 3px 0 var(--ink);
      cursor: pointer;
      font-weight: 700;
    }

    .replay:active { transform: translate(-2px, 3px); box-shadow: none; }
    .confetti { position: absolute; z-index: 4; inset: 0; overflow: hidden; pointer-events: none; direction: ltr; }
    .confetti i {
      position: absolute;
      top: -18px;
      left: var(--left);
      width: 8px;
      height: 13px;
      border-radius: 2px;
      background: var(--color);
      animation: confetti var(--duration) var(--delay) ease-in both;
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(.92); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes confetti {
      0% { transform: translate(0, -4px) rotate(0); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(var(--drift), var(--confetti-fall, 510px)) rotate(var(--spin)); opacity: 0; }
    }

    @media (max-width: 760px), (pointer: coarse) and (max-height: 600px) {
      .layout { width: 100%; padding: 0; }
      .card {
        height: 100svh;
        height: 100dvh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        --confetti-fall: calc(100dvh + 20px);
      }
      .card::before {
        inset: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }
      .speech { top: max(30px, calc(env(safe-area-inset-top) + 16px)); font-size: 1.2rem; }
      .hint { bottom: max(30px, calc(env(safe-area-inset-bottom) + 16px)); }
      .chick-button { width: min(48vw, 34dvh, 244px); }
      .party-chick { width: clamp(96px, 21dvh, 154px); }
      .celebration h2 { font-size: clamp(1.9rem, 9vw, 3.5rem); }
    }

    @media (max-height: 430px) and (orientation: landscape) {
      .celebration { gap: 7px; }
      .party-chick { width: 83px; }
      .celebration h2 { font-size: 2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .confetti { display: none; }
    }
  </style>
</head>
<body>
  <main class="layout">
    <section class="card" id="card" aria-label="لعبة الكتكوت" data-count="0">
      <span class="doodle doodle-top" aria-hidden="true">✦</span>
      <span class="doodle doodle-side" aria-hidden="true">♡</span>
      <span class="doodle doodle-bottom" aria-hidden="true">✧</span>
      <p class="speech" id="speech" role="status">دوس عليا!</p>
      <button class="chick-button" id="chick-button" type="button" aria-label="دوس عليا">
        <span class="chick" aria-hidden="true">
          <span class="shadow"></span>
          <span class="feet feet-left"></span><span class="feet feet-right"></span>
          <span class="tuft"></span><span class="body"></span>
          <span class="wing wing-left"></span><span class="wing wing-right"></span>
          <span class="eye eye-left"></span><span class="eye eye-right"></span>
          <span class="blush blush-left"></span><span class="blush blush-right"></span>
          <span class="beak"></span>
        </span>
      </button>
      <p class="hint" id="hint">امسكي الكتكوت عشان تعرفي السر.</p>
      <div class="celebration" id="celebration" hidden>
        <span class="chick party-chick" aria-hidden="true">
          <span class="shadow"></span>
          <span class="feet feet-left"></span><span class="feet feet-right"></span>
          <span class="body"></span><span class="hat"></span><span class="hat-dot"></span>
          <span class="wing wing-left"></span><span class="wing wing-right"></span>
          <span class="eye eye-left"></span><span class="eye eye-right"></span>
          <span class="blush blush-left"></span><span class="blush blush-right"></span>
          <span class="beak"></span>
        </span>
        <h2 id="greeting" lang="en" dir="ltr" tabindex="-1">Happy birth to you <span>asiya</span></h2>
        <p>كل سنة وإنتِ طيبة يا اسيه! 💜</p>
        <button class="replay" id="replay" type="button">نلعب تاني؟</button>
      </div>
      <div class="confetti" id="confetti" aria-hidden="true"></div>
    </section>
  </main>
  <script>
    const dodges = [
      { x: '73%', y: '37%', tilt: '13deg', message: 'فلت منك هههه!' },
      { x: '27%', y: '67%', tilt: '-17deg', message: 'فلت منك هههه… تاني!' },
      { x: '74%', y: '68%', tilt: '16deg', message: 'فلت منك هههه، قربتي!' },
    ];
    const card = document.querySelector('#card');
    const chickButton = document.querySelector('#chick-button');
    const speech = document.querySelector('#speech');
    const hint = document.querySelector('#hint');
    const celebration = document.querySelector('#celebration');
    const greeting = document.querySelector('#greeting');
    const replay = document.querySelector('#replay');
    const confetti = document.querySelector('#confetti');
    let taps = 0;

    chickButton.addEventListener('click', () => {
      const dodge = dodges[taps];
      taps += 1;
      card.dataset.count = taps;

      if (dodge) {
        chickButton.style.setProperty('--x', dodge.x);
        chickButton.style.setProperty('--y', dodge.y);
        chickButton.style.setProperty('--tilt', dodge.tilt);
        speech.textContent = dodge.message;
        return;
      }

      chickButton.hidden = true;
      speech.hidden = true;
      hint.hidden = true;
      celebration.hidden = false;
      greeting.focus({ preventScroll: true });
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const colors = ['#8755d8', '#f478ad', '#ffd260', '#74d6b7'];
        for (let index = 0; index < 36; index += 1) {
          const piece = document.createElement('i');
          piece.style.setProperty('--left', Math.random() * 100 + '%');
          piece.style.setProperty('--color', colors[index % colors.length]);
          piece.style.setProperty('--duration', 1.1 + Math.random() + 's');
          piece.style.setProperty('--delay', Math.random() * .5 + 's');
          piece.style.setProperty('--drift', Math.random() * 100 - 50 + 'px');
          piece.style.setProperty('--spin', Math.random() * 740 - 370 + 'deg');
          piece.addEventListener('animationend', () => piece.remove(), { once: true });
          confetti.append(piece);
        }
      }
    });

    replay.addEventListener('click', () => {
      taps = 0;
      card.dataset.count = 0;
      chickButton.removeAttribute('style');
      speech.textContent = 'دوس عليا!';
      confetti.replaceChildren();
      celebration.hidden = true;
      hint.hidden = false;
      speech.hidden = false;
      chickButton.hidden = false;
      chickButton.focus({ preventScroll: true });
    });
  </script>
</body>
</html>
